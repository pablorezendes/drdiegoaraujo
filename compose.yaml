name: drdiegoaraujo

services:
  noerion:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${NOERION_PORT:-8088}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
