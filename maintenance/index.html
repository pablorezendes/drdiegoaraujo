<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111316">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="O site do Dr. Diego de Araújo está em manutenção. Voltamos em breve.">
  <title>Dr. Diego de Araújo — Site em manutenção</title>
  <style>
    :root{color-scheme:dark;--ink:#111316;--ivory:#f7f5f1;--gold:#c8aa79;--muted:#a8a59d}
    *{box-sizing:border-box}html{min-height:100%;background:var(--ink)}body{margin:0;color:var(--ivory);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
    .page{min-height:100svh;display:flex;flex-direction:column;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#24231f 0,transparent 53%)}
    .orbit{position:absolute;width:690px;height:690px;border:1px solid rgba(200,170,121,.09);border-radius:50%;z-index:-1;pointer-events:none}.orbit-top{top:-455px;right:-290px}.orbit-bottom{bottom:-460px;left:-285px}
    header{padding:37px 24px;text-align:center}.brand{margin:0;font-size:11px;line-height:1.6;letter-spacing:2.7px;font-weight:400}.signature{display:block;margin-top:8px;font-size:7px;line-height:1.5;letter-spacing:3.3px;color:var(--gold)}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:42px 24px 60px;text-align:center}.content{width:min(100%,580px)}
    .emblem{display:block;width:96px;height:96px;margin:0 auto 35px;color:var(--gold)}.eyebrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:0;font-size:9px;line-height:1.6;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}.diamond{width:4px;height:4px;background:var(--gold);transform:rotate(45deg)}
    h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(52px,8vw,88px);font-weight:400;line-height:1.07;letter-spacing:-3px;margin:26px 0 24px}h1 em{color:var(--gold);font-weight:400}
    .description{max-width:350px;margin:0 auto;color:var(--muted);font-size:13px;line-height:1.95}.rule{width:44px;height:1px;background:var(--gold);margin:32px auto 21px;opacity:.7}.closing{font-family:Georgia,'Times New Roman',serif;font-style:italic;color:#d0c4ae;font-size:18px;line-height:1.6;margin:0}
    footer{text-align:center;padding:25px 24px 30px;font-size:8px;line-height:1.8;letter-spacing:1.1px;color:#84857e}footer span{color:var(--gold);margin-inline:9px}
    ::selection{background:var(--gold);color:var(--ink)}
    @media(max-width:480px){header{padding-top:30px}.brand{font-size:9px;letter-spacing:2px}.signature{font-size:6px;letter-spacing:2.8px}main{padding-top:26px;padding-bottom:36px}.emblem{width:82px;height:82px;margin-bottom:29px}.eyebrow{font-size:7px;letter-spacing:2.4px}h1{letter-spacing:-2px;margin-top:24px}.description{font-size:12px;max-width:290px}.closing{font-size:17px}footer{font-size:7px;padding-bottom:24px}.orbit-top{right:-450px}.orbit-bottom{left:-445px}}
  </style>
</head>
<body>
  <div class="page">
    <div class="orbit orbit-top" aria-hidden="true"></div><div class="orbit orbit-bottom" aria-hidden="true"></div>
    <header><p class="brand">DR. DIEGO DE ARAÚJO<span class="signature">NOÉRION · SIGNATURE SYSTEM</span></p></header>
    <main>
      <div class="content">
        <svg class="emblem" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="200" cy="200" r="154"/><circle cx="283" cy="200" r="83"/><circle cx="241.5" cy="271.88" r="83"/><circle cx="158.5" cy="271.88" r="83"/><circle cx="117" cy="200" r="83"/><circle cx="158.5" cy="128.12" r="83"/><circle cx="241.5" cy="128.12" r="83"/></g><path d="M90 202C144 157 253 156 311 200C251 236 142 242 90 202" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="200" cy="199" r="20" fill="currentColor"/><path d="M214 233Q218 284 266 265M182 229L177 270" fill="none" stroke="currentColor" stroke-width="5"/></svg>
        <p class="eyebrow"><span class="diamond" aria-hidden="true"></span> Site em manutenção <span class="diamond" aria-hidden="true"></span></p>
        <h1>Voltamos<br><em>em breve.</em></h1>
        <p class="description">Estamos cuidando dos últimos detalhes para receber você. Nosso site está temporariamente em manutenção.</p>
        <div class="rule" aria-hidden="true"></div>
        <p class="closing">Agradecemos pela sua visita.</p>
      </div>
    </main>
    <footer>DR. DIEGO DE ARAÚJO <span>·</span> NOÉRION</footer>
  </div>
</body>
</html>
