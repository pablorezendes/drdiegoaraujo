map $uri $noerion_cache_control {
    default "no-cache";
    ~^/api(?:/|$) "no-store";
    ~^/img/ "public, max-age=3600, must-revalidate";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $noerion_cache_control always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html { return 308 /$is_args$args; }
    location = /conversa.html { return 308 /conversa$is_args$args; }
    location = /privacidade.html { return 308 /privacidade$is_args$args; }
    location = /termos.html { return 308 /termos$is_args$args; }
    location = /conversa/ { return 308 /conversa$is_args$args; }
    location = /privacidade/ { return 308 /privacidade$is_args$args; }
    location = /termos/ { return 308 /termos$is_args$args; }

    location = / { try_files /index.html =404; }
    location = /conversa { try_files /conversa.html =404; }
    location = /privacidade { try_files /privacidade.html =404; }
    location = /termos { try_files /termos.html =404; }

    # O contato real permanece desativado ate configuracao e validacao do SMTP.
    location = /api {
        default_type application/json;
        return 503 '{"ok":false,"message":"O envio está indisponível no momento. Tente novamente mais tarde."}';
    }
    location ^~ /api/ {
        default_type application/json;
        return 503 '{"ok":false,"message":"O envio está indisponível no momento. Tente novamente mais tarde."}';
    }

    location ~ (^|/)\. { return 404; }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
}
